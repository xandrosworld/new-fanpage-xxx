<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lấy key nhiệm vụ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #ecfeff);
            color: #111827;
        }
        main {
            width: min(560px, 100%);
            display: grid;
            gap: 18px;
            padding: 28px;
            border-radius: 10px;
            border: 1px solid #dbe4ee;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
        }
        .eyebrow {
            color: #0f766e;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.15;
        }
        p {
            margin: 0;
            color: #475569;
            line-height: 1.65;
        }
        code {
            display: block;
            width: 100%;
            min-height: 72px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #0f172a;
            background: #0f172a;
            color: #f8fafc;
            word-break: break-all;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button,
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #111827;
            cursor: pointer;
            text-decoration: none;
            font: inherit;
            font-weight: 700;
        }
        .primary {
            background: #0ea5a4;
            color: #fff;
            border-color: #0ea5a4;
        }
        .status {
            min-height: 20px;
            color: #0f766e;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Key nhiệm vụ Link4m</div>
        <h1>Key của bạn đã sẵn sàng</h1>
        <p>Copy key này, quay lại trang nhiệm vụ và dán vào ô nhận thưởng. Key chỉ dùng được một lần trong ngày.</p>
        <code id="key-output">Đang tải...</code>
        <div class="actions">
            <button class="primary" id="copy-btn" type="button">Copy key</button>
            <a href="/nhiemvu">Quay lại nhiệm vụ</a>
        </div>
        <div id="copy-status" class="status"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const output = document.getElementById('key-output');
        const status = document.getElementById('copy-status');
        output.textContent = token || 'Không có key.';

        document.getElementById('copy-btn').addEventListener('click', async () => {
            if (!token) {
                status.textContent = 'Không có key để copy.';
                return;
            }
            try {
                await navigator.clipboard.writeText(token);
                status.textContent = 'Đã copy key.';
            } catch (_) {
                status.textContent = 'Không thể copy tự động, hãy bôi đen key và copy thủ công.';
            }
        });
    </script>
</body>
</html>
