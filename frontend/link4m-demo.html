<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link4m Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #eef7f5;
            color: #13201d;
        }
        main {
            width: min(620px, 100%);
            display: grid;
            gap: 18px;
            padding: 28px;
            border-radius: 10px;
            border: 1px solid #cfe2dc;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(19, 32, 29, 0.12);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e2ece8;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 900;
            color: #0f766e;
        }
        .badge {
            padding: 7px 10px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #047857;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.16;
        }
        p {
            margin: 0;
            color: #52615d;
            line-height: 1.65;
        }
        .progress {
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: #dcebe6;
        }
        .bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #0f766e, #14b8a6);
            transition: width 0.25s ease;
        }
        .panel {
            display: grid;
            gap: 8px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #dcebe6;
            background: #f8fcfb;
        }
        .panel strong {
            color: #13201d;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button,
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 18px;
            border-radius: 8px;
            border: 1px solid #c7d7d2;
            background: #fff;
            color: #13201d;
            cursor: pointer;
            text-decoration: none;
            font: inherit;
            font-weight: 800;
        }
        button.primary {
            background: #0f766e;
            color: #fff;
            border-color: #0f766e;
        }
        button:disabled {
            cursor: wait;
            opacity: 0.62;
        }
        .small {
            font-size: 13px;
            color: #66736f;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <div class="logo">Link4m</div>
            <div class="badge">Demo bypass</div>
        </div>

        <h1>Đang xác minh link nhiệm vụ</h1>
        <p>Đây là mô phỏng Link4m cho bản demo. Chờ vài giây rồi bấm tiếp tục để lấy key nhiệm vụ.</p>

        <div class="progress" aria-hidden="true">
            <div class="bar" id="bar"></div>
        </div>

        <div class="panel">
            <strong id="countdown">Vui lòng chờ 3 giây</strong>
            <span class="small">Sau bước này hệ thống sẽ mở trang key giống luồng vượt link thật.</span>
        </div>

        <div class="actions">
            <button class="primary" id="continue-btn" type="button" disabled>Tiếp tục lấy key</button>
            <a href="/">Về trang chủ</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fallback = new URL('/vuot-link.html', window.location.origin);
        fallback.searchParams.set('token', 'DEMO-SANG-2026');

        const target = params.get('to') || fallback.toString();
        const countdown = document.getElementById('countdown');
        const button = document.getElementById('continue-btn');
        const bar = document.getElementById('bar');
        let remaining = 3;

        function render() {
            countdown.textContent = remaining > 0
                ? `Vui lòng chờ ${remaining} giây`
                : 'Link đã sẵn sàng';
            bar.style.width = `${Math.round(((3 - remaining) / 3) * 100)}%`;
        }

        render();
        const timer = setInterval(() => {
            remaining -= 1;
            render();
            if (remaining <= 0) {
                clearInterval(timer);
                bar.style.width = '100%';
                button.disabled = false;
            }
        }, 1000);

        button.addEventListener('click', () => {
            window.location.href = target;
        });
    </script>
</body>
</html>
