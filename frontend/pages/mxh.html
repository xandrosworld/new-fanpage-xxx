<div class="container mxh-list-page">
    <div class="mxh-list-hero mxh-list-hero--service">
        <div class="mxh-list-hero-content">
            <div class="mxh-hero-text-wrap">
                <div class="mxh-list-hero-icon-box">
                    <i class="fas fa-share-nodes"></i>
                </div>
                <h1 class="page-title">Dịch vụ MXH & tài khoản số</h1>
                <p class="section-subtitle">Facebook · TikTok · Instagram · YouTube · X · Zalo · Telegram cho nhu cầu MMO, seeding và vận hành shop.</p>
                <div class="mxh-hero-points">
                    <span><i class="fas fa-shield-halved"></i> Có kiểm tra trước khi đăng</span>
                    <span><i class="fas fa-wallet"></i> Thanh toán qua số dư</span>
                    <span><i class="fas fa-bolt"></i> Nhận thông tin ngay sau mua</span>
                </div>
            </div>
            <div id="mxh-sell-btn-wrap"></div>
        </div>
    </div>

    <div class="mxh-platform-tabs-wrap">
        <div class="mxh-platform-tabs" id="mxh-platform-tabs">
            <button class="mxh-tab-btn active" data-platform="all">
                <i class="fas fa-globe"></i> Tất cả
            </button>
        </div>
    </div>

    <div class="mxh-filter-bar">
        <div class="mxh-category-chips" id="mxh-category-chips">
            <button class="mxh-chip active" data-cat="">Tất cả loại</button>
        </div>
        <div class="mxh-sort-wrap">
            <select id="mxh-sort" class="mxh-sort-select">
                <option value="newest">Mới nhất</option>
                <option value="price_asc">Giá tăng dần</option>
                <option value="price_desc">Giá giảm dần</option>
                <option value="popular">Phổ biến</option>
            </select>
        </div>
    </div>

    <div id="mxh-grid" class="mxh-grid"></div>
    <div id="mxh-pagination" class="pagination"></div>
</div>

<div id="mxh-detail-modal" class="mxh-detail-modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="mxh-detail-modal">
        <button class="mxh-detail-close" id="mxh-detail-close" aria-label="Đóng">
            <i class="fas fa-xmark"></i>
        </button>
        <div id="mxh-detail-content" class="mxh-detail-content"></div>
    </div>
</div>
